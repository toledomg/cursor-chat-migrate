name: Publish Public Repository

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Debug
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -eux

          echo "Git version"
          git --version

          echo "Current remotes"
          git remote -v

          echo "Adding public remote"
          git remote add public https://x-access-token:${TOKEN}@github.com/toledomg/cursor-chat-migrate.git

          echo "Testing authentication"
          git ls-remote public

          echo "Pushing..."
          git push public HEAD:main --force
