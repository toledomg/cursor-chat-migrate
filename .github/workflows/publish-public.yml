name: Publish Public Repository

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Add Public Remote
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euxo pipefail

          echo "Token length: ${#TOKEN}"

          git remote add public https://x-access-token:${TOKEN}@github.com/toledomg/cursor-chat-migrate.git

          git remote -v

          echo "Testing authentication..."
          git ls-remote public

      - name: Push Main
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          set -euxo pipefail

          git push public HEAD:main --force
