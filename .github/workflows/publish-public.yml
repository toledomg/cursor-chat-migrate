name: Publish Public Repository

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout private repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Remove private workflows
        run: |
          rm -rf .github/workflows

      - name: Add public remote
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
        run: |
          git remote add public https://x-access-token:${TOKEN}@github.com/toledomg/cursor-chat-migrate.git

      - name: Commit workflow removal (if needed)
        run: |
          git add -A
          git diff --cached --quiet || git commit -m "Prepare public repository"

      - name: Push to public repository
        run: |
          git push public HEAD:main --force
