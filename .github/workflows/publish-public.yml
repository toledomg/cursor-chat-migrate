name: Publish Public Repository

on:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Private Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main to Public Repository
        env:
          TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}

        run: |
          set -euxo pipefail

          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

          git remote -v

          git remote add public https://x-access-token:${TOKEN}@github.com/toledomg/cursor-chat-migrate.git

          git remote -v

          git ls-remote public

          git push public HEAD:main --force
